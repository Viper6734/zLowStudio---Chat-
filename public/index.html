<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Pro en Tiempo Real</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Modal de Apodo */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #141418;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #26262e;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 320px;
        }

        .modal-box h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1e1e24;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-box button:hover {
            background: #0056b3;
        }

        /* Admin Trigger flotante en esquina */
        #admin-trigger {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #1a1a22;
            border: 1px solid #333;
            color: #888;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        #admin-trigger:hover {
            color: #fff;
            border-color: #007bff;
        }

        /* Modal Admin */
        #admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }

        /* Layout Principal */
        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 82vh;
            background: #111115;
            border-radius: 12px;
            border: 1px solid #1f1f26;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-header {
            font-size: 1.1rem;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 1px solid #1f1f26;
            margin-bottom: 15px;
            color: #ccc;
        }

        /* Mensajes con Animación de Burbuja */
        #messages {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        @keyframes bubbleOpen {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .msg-bubble {
            background: #0056b3;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            max-width: 80%;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 86, 175, 0.3);
            animation: bubbleOpen 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: bottom left;
        }

        .msg-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b3d7ff;
            margin-bottom: 4px;
            gap: 15px;
        }

        .msg-text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        #messages li.system {
            background: transparent;
            border: none;
            color: #777;
            font-style: italic;
            text-align: center;
            align-self: center;
            font-size: 0.85rem;
            animation: none;
            box-shadow: none;
            max-width: 100%;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2a2a35;
            background: #181820;
            color: #fff;
            outline: none;
        }

        .chat-form button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-form button:hover {
            background: #0056b3;
        }

        /* Panel Lateral */
        .users-sidebar {
            width: 260px;
            background: #16161c;
            border-left: 1px solid #1f1f26;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .users-sidebar h3 {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #users-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        #users-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1d1d26;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .user-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            box-shadow: 0 0 6px #28a745;
            flex-shrink: 0;
        }

        /* Botón Kick Amarillo */
        .kick-btn {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            display: none; /* Oculto por defecto hasta ser admin */
            transition: background 0.2s;
        }
        .kick-btn:hover {
            background: #e0a800;
        }
    </style>
</head>
<body>

    <!-- Botón Admin en la esquina superior -->
    <button id="admin-trigger">Admin Access</button>

    <!-- Modal Login Admin -->
    <div id="admin-modal">
        <div class="modal-box">
            <h2>Panel Admin</h2>
            <input type="password" id="admin-pass-input" placeholder="Contraseña (1509)..." autocomplete="off">
            <button id="admin-login-btn">Acceder</button>
            <button id="admin-close-btn" style="background: #333; margin-top: 8px;">Cancelar</button>
        </div>
    </div>

    <!-- Modal para ingresar Apodo -->
    <div id="modal-overlay">
        <div class="modal-box">
            <h2>Ingresa al Chat</h2>
            <input type="text" id="nickname-input" placeholder="Tu apodo..." autocomplete="off">
            <button id="join-btn">Entrar</button>
        </div>
    </div>

    <!-- Contenedor Principal del Chat -->
    <div class="chat-container">
        <div class="chat-main">
            <div class="chat-header">
                Chat 234 | Usuario: <span id="current-user">-</span>
            </div>
            <ul id="messages"></ul>
            <form id="form" class="chat-form">
                <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                <button>Enviar</button>
            </form>
        </div>

        <!-- Panel Lateral de Conectados -->
        <div class="users-sidebar">
            <h3>Conectados (<span id="user-count">0</span>)</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const modalOverlay = document.getElementById('modal-overlay');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const currentUserSpan = document.getElementById('current-user');

        const adminTrigger = document.getElementById('admin-trigger');
        const adminModal = document.getElementById('admin-modal');
        const adminPassInput = document.getElementById('admin-pass-input');
        const adminLoginBtn = document.getElementById('admin-login-btn');
        const adminCloseBtn = document.getElementById('admin-close-btn');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');

        let myNickname = '';
        let isAdmin = false;
        let currentUsersData = {};

        function joinChat() {
            const name = nicknameInput.value.trim();
            if (name !== '') {
                myNickname = name;
                currentUserSpan.textContent = myNickname;
                socket.emit('join', myNickname);
                modalOverlay.style.display = 'none';
            }
        }

        joinBtn.addEventListener('click', joinChat);
        nicknameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinChat();
        });

        // Admin Trigger Logic
        adminTrigger.addEventListener('click', () => {
            if (isAdmin) {
                alert('¡Ya tienes permisos de Administrador activos!');
            } else {
                adminModal.style.display = 'flex';
            }
        });

        adminCloseBtn.addEventListener('click', () => {
            adminModal.style.display = 'none';
        });

        adminLoginBtn.addEventListener('click', () => {
            if (adminPassInput.value === '1509') {
                isAdmin = true;
                adminModal.style.display = 'none';
                adminTrigger.textContent = 'Admin: ACTIVO';
                adminTrigger.style.borderColor = '#28a745';
                adminTrigger.style.color = '#28a745';
                alert('¡Contraseña correcta! Ahora puedes ver los botones Kick en la lista.');
                renderUsersList(currentUsersData);
            } else {
                alert('Contraseña incorrecta');
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                const now = new Date();
                const timeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                socket.emit('chat message', {
                    text: input.value,
                    time: timeStr
                });
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.innerHTML = `
                <div class="msg-bubble">
                    <div class="msg-info">
                        <span><strong>[234] ${data.user}</strong></span>
                        <span>${data.time}</span>
                    </div>
                    <div class="msg-text">${data.text}</div>
                </div>
            `;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('system-message', (msg) => {
            const item = document.createElement('li');
            item.classList.add('system');
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('update-users', (usersObj) => {
            currentUsersData = usersObj;
            renderUsersList(usersObj);
        });

        function renderUsersList(usersObj) {
            usersList.innerHTML = '';
            const entries = Object.entries(usersObj);
            userCount.textContent = entries.length;

            entries.forEach(([id, name]) => {
                const li = document.createElement('li');
                
                const leftDiv = document.createElement('div');
                leftDiv.className = 'user-left';
                leftDiv.innerHTML = `<span class="status-dot"></span><span>${name}</span>`;
                li.appendChild(leftDiv);

                // Botón kick si es admin
                const kickBtn = document.createElement('button');
                kickBtn.className = 'kick-btn';
                kickBtn.textContent = 'Kick';
                if (isAdmin) {
                    kickBtn.style.display = 'inline-block';
                }

                kickBtn.addEventListener('click', () => {
                    socket.emit('kick user', { targetId: id, adminName: myNickname });
                });

                li.appendChild(kickBtn);
                usersList.appendChild(li);
            });
        }

        socket.on('kicked', (adminName) => {
            alert(`¡Has sido expulsado del chat por ${adminName}!`);
            window.location.reload();
        });
    </script>
</body>
</html>
