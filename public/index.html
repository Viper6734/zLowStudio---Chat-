<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Pro - Modales Personalizados</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Estilo Base de Modales */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #141418;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #26262e;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
            width: 340px;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .modal-box p {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1e1e24;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        .modal-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-box button:hover {
            background: #0056b3;
        }

        /* Botón Admin en Esquina */
        #admin-trigger {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #1a1a22;
            border: 1px solid #333;
            color: #888;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        #admin-trigger:hover {
            color: #fff;
            border-color: #007bff;
        }

        /* Layout Principal */
        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 82vh;
            background: #111115;
            border-radius: 12px;
            border: 1px solid #1f1f26;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-header {
            font-size: 1.1rem;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 1px solid #1f1f26;
            margin-bottom: 15px;
            color: #ccc;
        }

        /* Animaciones para Mensajes */
        @keyframes sentBubble {
            0% { opacity: 0; transform: scale(0.2) translateY(30px) rotate(-5deg); }
            70% { transform: scale(1.05) translateY(-3px) rotate(1deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        @keyframes receivedBubble {
            0% { opacity: 0; transform: translateX(-40px) scaleX(0.8); }
            70% { transform: translateX(5px) scaleX(1.02); }
            100% { opacity: 1; transform: translateX(0) scaleX(1); }
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        #messages li {
            max-width: 80%;
            word-wrap: break-word;
        }

        #messages li.sent-msg {
            align-self: flex-end;
            animation: sentBubble 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: bottom right;
        }

        #messages li.received-msg {
            align-self: flex-start;
            animation: receivedBubble 0.35s ease-out forwards;
            transform-origin: bottom left;
        }

        .msg-bubble {
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sent-msg .msg-bubble { border-bottom-right-radius: 2px; }
        .received-msg .msg-bubble { border-bottom-left-radius: 2px; }

        .msg-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 4px;
            gap: 15px;
        }

        .msg-text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        #messages li.system {
            background: transparent;
            border: none;
            color: #777;
            font-style: italic;
            text-align: center;
            align-self: center;
            font-size: 0.85rem;
            animation: none;
            box-shadow: none;
            max-width: 100%;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2a2a35;
            background: #181820;
            color: #fff;
            outline: none;
        }

        .chat-form button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-form button:hover { background: #0056b3; }

        /* Panel Lateral */
        .users-sidebar {
            width: 280px;
            background: #16161c;
            border-left: 1px solid #1f1f26;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .users-sidebar h3 {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #users-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        #users-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1d1d26;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .user-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            box-shadow: 0 0 6px #28a745;
            flex-shrink: 0;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-control { display: none; }

        .edit-btn {
            background: #17a2b8;
            color: #fff;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .color-picker-input {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        .kick-btn {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .kick-btn:hover { background: #e0a800; }
    </style>
</head>
<body>

    <button id="admin-trigger">Admin Access</button>

    <!-- Modal Admin Password -->
    <div id="admin-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Panel Admin</h2>
            <input type="password" id="admin-pass-input" placeholder="Contraseña (1509)..." autocomplete="off">
            <button id="admin-login-btn">Acceder</button>
            <button id="admin-close-btn" style="background: #333; margin-top: 8px;">Cancelar</button>
        </div>
    </div>

    <!-- Modal Editar Nombre (Reemplaza a prompt) -->
    <div id="edit-name-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Cambiar Nombre</h2>
            <p id="edit-target-text">Ingresa el nuevo apodo para el jugador:</p>
            <input type="text" id="edit-name-input" placeholder="Nuevo apodo..." autocomplete="off">
            <button id="save-name-btn">Guardar Cambios</button>
            <button id="cancel-name-btn" style="background: #333; margin-top: 8px;">Cancelar</button>
        </div>
    </div>

    <!-- Modal Personalizado de KICK (Reemplaza a alert) -->
    <div id="kicked-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="border-color: #dc3545;">
            <h2 style="color: #dc3545;">¡Has sido Expulsado!</h2>
            <p id="kicked-reason-text">El administrador te ha sacado de la sala.</p>
            <button id="reconnect-btn" style="background: #dc3545;">Volver a Conectarte</button>
        </div>
    </div>

    <!-- Modal de Inicio (Apodo) -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h2>Ingresa al Chat</h2>
            <input type="text" id="nickname-input" placeholder="Tu apodo..." autocomplete="off">
            <button id="join-btn">Entrar</button>
        </div>
    </div>

    <!-- Interface Principal -->
    <div class="chat-container">
        <div class="chat-main">
            <div class="chat-header">
                Chat 234 | Usuario: <span id="current-user">-</span>
            </div>
            <ul id="messages"></ul>
            <form id="form" class="chat-form">
                <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                <button>Enviar</button>
            </form>
        </div>

        <div class="users-sidebar">
            <h3>Conectados (<span id="user-count">0</span>)</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const modalOverlay = document.getElementById('modal-overlay');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const currentUserSpan = document.getElementById('current-user');

        const adminTrigger = document.getElementById('admin-trigger');
        const adminModal = document.getElementById('admin-modal');
        const adminPassInput = document.getElementById('admin-pass-input');
        const adminLoginBtn = document.getElementById('admin-login-btn');
        const adminCloseBtn = document.getElementById('admin-close-btn');

        const editNameModal = document.getElementById('edit-name-modal');
        const editTargetText = document.getElementById('edit-target-text');
        const editNameInput = document.getElementById('edit-name-input');
        const saveNameBtn = document.getElementById('save-name-btn');
        const cancelNameBtn = document.getElementById('cancel-name-btn');

        const kickedModal = document.getElementById('kicked-modal');
        const kickedReasonText = document.getElementById('kicked-reason-text');
        const reconnectBtn = document.getElementById('reconnect-btn');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');

        let myNickname = '';
        let isAdmin = false;
        let currentUsersData = {};
        let selectedTargetId = null;

        function playMessageSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function joinChat() {
            const name = nicknameInput.value.trim();
            if (name !== '') {
                myNickname = name;
                currentUserSpan.textContent = myNickname;
                socket.emit('join', myNickname);
                modalOverlay.style.display = 'none';
            }
        }

        joinBtn.addEventListener('click', joinChat);
        nicknameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinChat();
        });

        // Admin Access Modal
        adminTrigger.addEventListener('click', () => {
            if (!isAdmin) adminModal.style.display = 'flex';
        });

        adminCloseBtn.addEventListener('click', () => {
            adminModal.style.display = 'none';
        });

        adminLoginBtn.addEventListener('click', () => {
            if (adminPassInput.value === '1509') {
                isAdmin = true;
                adminModal.style.display = 'none';
                adminTrigger.textContent = 'Admin: ACTIVO';
                adminTrigger.style.borderColor = '#28a745';
                adminTrigger.style.color = '#28a745';
                renderUsersList(currentUsersData);
            } else {
                adminPassInput.value = '';
                adminPassInput.placeholder = '¡Contraseña Incorrecta!';
            }
        });

        // Modal Editar Nombre
        saveNameBtn.addEventListener('click', () => {
            const newName = editNameInput.value.trim();
            if (newName !== '' && selectedTargetId) {
                socket.emit('admin update user', { targetId: selectedTargetId, newName: newName, newColor: null });
                editNameModal.style.display = 'none';
            }
        });

        cancelNameBtn.addEventListener('click', () => {
            editNameModal.style.display = 'none';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                const now = new Date();
                const timeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                socket.emit('chat message', {
                    text: input.value,
                    time: timeStr
                });
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            playMessageSound();

            const item = document.createElement('li');
            const isMe = (data.senderId === socket.id);
            item.className = isMe ? 'sent-msg' : 'received-msg';

            item.innerHTML = `
                <div class="msg-bubble" style="background-color: ${data.color}">
                    <div class="msg-info">
                        <span><strong>[234] ${data.user}</strong></span>
                        <span>${data.time}</span>
                    </div>
                    <div class="msg-text">${data.text}</div>
                </div>
            `;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('system-message', (msg) => {
            const item = document.createElement('li');
            item.classList.add('system');
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('update-users', (usersObj) => {
            currentUsersData = usersObj;
            renderUsersList(usersObj);
        });

        function renderUsersList(usersObj) {
            usersList.innerHTML = '';
            const entries = Object.entries(usersObj);
            userCount.textContent = entries.length;

            entries.forEach(([id, uData]) => {
                const li = document.createElement('li');
                
                const leftDiv = document.createElement('div');
                leftDiv.className = 'user-left';
                leftDiv.innerHTML = `<span class="status-dot"></span><span style="color: ${uData.color}; font-weight: bold;">${uData.nickname}</span>`;
                li.appendChild(leftDiv);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'user-actions';

                if (isAdmin) {
                    // Botón Lápiz (Abre modal personalizado)
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-btn admin-control';
                    editBtn.style.display = 'inline-block';
                    editBtn.textContent = '✏️';
                    editBtn.title = 'Cambiar nombre';
                    editBtn.addEventListener('click', () => {
                        selectedTargetId = id;
                        editTargetText.textContent = `Ingresa el nuevo apodo para "${uData.nickname}":`;
                        editNameInput.value = uData.nickname;
                        editNameModal.style.display = 'flex';
                    });

                    // Color picker
                    const colorPicker = document.createElement('input');
                    colorPicker.type = 'color';
                    colorPicker.className = 'color-picker-input admin-control';
                    colorPicker.style.display = 'inline-block';
                    colorPicker.value = uData.color;
                    colorPicker.title = 'Cambiar color';
                    colorPicker.addEventListener('change', (e) => {
                        socket.emit('admin update user', { targetId: id, newName: null, newColor: e.target.value });
                    });

                    // Botón Kick
                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'kick-btn admin-control';
                    kickBtn.style.display = 'inline-block';
                    kickBtn.textContent = 'Kick';
                    kickBtn.addEventListener('click', () => {
                        socket.emit('kick user', { targetId: id, adminName: myNickname });
                    });

                    actionsDiv.appendChild(editBtn);
                    actionsDiv.appendChild(colorPicker);
                    actionsDiv.appendChild(kickBtn);
                }

                li.appendChild(actionsDiv);
                usersList.appendChild(li);
            });
        }

        // Evento KICK recibido (Modal Personalizado)
        socket.on('kicked', (adminName) => {
            kickedReasonText.textContent = `El administrador "${adminName}" te ha expulsado de la sala.`;
            kickedModal.style.display = 'flex';
        });

        reconnectBtn.addEventListener('click', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
