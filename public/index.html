<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Modal para pedir Apodo */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #181818;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 320px;
        }

        .modal-box h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-box button:hover {
            background: #0056b3;
        }

        /* Layout Principal del Chat */
        .chat-container {
            display: flex;
            width: 100%;
            max-width: 950px;
            height: 80vh;
            background: #121212;
            border-radius: 12px;
            border: 1px solid #222;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Área central del chat */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-header {
            font-size: 1.2rem;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        #messages li {
            background: #1e1e1e;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            max-width: 85%;
            word-wrap: break-word;
        }

        #messages li.system {
            background: transparent;
            border: none;
            color: #888;
            font-style: italic;
            text-align: center;
            align-self: center;
            font-size: 0.9rem;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-form input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #181818;
            color: #fff;
            outline: none;
        }

        .chat-form button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-form button:hover {
            background: #0056b3;
        }

        /* Panel lateral de Usuarios Conectados */
        .users-sidebar {
            width: 240px;
            background: #181818;
            border-left: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .users-sidebar h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #users-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        #users-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #ddd;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #28a745;
            border-radius: 50%;
            box-shadow: 0 0 8px #28a745;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Modal para ingresar Apodo -->
    <div id="modal-overlay">
        <div class="modal-box">
            <h2>Ingresa al Chat</h2>
            <input type="text" id="nickname-input" placeholder="Tu apodo..." autocomplete="off">
            <button id="join-btn">Entrar</button>
        </div>
    </div>

    <!-- Contenedor Principal del Chat -->
    <div class="chat-container">
        <div class="chat-main">
            <div class="chat-header">
                Chat: 234 | Tu apodo: <span id="current-user">-</span>
            </div>
            <ul id="messages"></ul>
            <form id="form" class="chat-form">
                <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                <button>Enviar</button>
            </form>
        </div>

        <!-- Panel Lateral de Conectados -->
        <div class="users-sidebar">
            <h3>Conectados (<span id="user-count">0</span>)</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const modalOverlay = document.getElementById('modal-overlay');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const currentUserSpan = document.getElementById('current-user');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');

        let myNickname = '';

        function joinChat() {
            const name = nicknameInput.value.trim();
            if (name !== '') {
                myNickname = name;
                currentUserSpan.textContent = myNickname;
                socket.emit('join', myNickname);
                modalOverlay.style.display = 'none';
            }
        }

        joinBtn.addEventListener('click', joinChat);
        nicknameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinChat();
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.textContent = `[234] ${data.user}: ${data.text}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('system-message', (msg) => {
            const item = document.createElement('li');
            item.classList.add('system');
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('update-users', (users) => {
            usersList.innerHTML = '';
            userCount.textContent = users.length;
            users.forEach(user => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="status-dot"></span><span>${user}</span>`;
                usersList.appendChild(li);
            });
        });
    </script>
</body>
</html>
