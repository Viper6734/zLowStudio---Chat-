<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0b0b0e;
            --bg-container: #111115;
            --bg-sidebar: #16161c;
            --bg-modal: #141418;
            --bg-input: #181820;
            --border-color: #1f1f26;
            --glow-color: rgba(0, 123, 255, 0.4);
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-blue: #007bff;
            --font-family: 'Inter', sans-serif;
            
            /* Colores de Mención tipo Discord */
            --mention-bg: rgba(250, 166, 26, 0.12);
            --mention-border: #faa61a;
            --mention-tag-bg: rgba(88, 101, 242, 0.3);
            --mention-tag-text: #c9cdfb;
        }

        body.theme-cyberpunk {
            --bg-body: #0d0221;
            --bg-container: #0f0826;
            --bg-sidebar: #180e36;
            --bg-modal: #1c103f;
            --bg-input: #261654;
            --border-color: #ff0055;
            --glow-color: rgba(255, 0, 85, 0.6);
            --text-main: #00f6ff;
            --text-sub: #ff77a9;
            --accent-blue: #ff0055;
        }

        body.theme-midnight {
            --bg-body: #030814;
            --bg-container: #0a1128;
            --bg-sidebar: #0f1c3f;
            --bg-modal: #13224f;
            --bg-input: #1c2d5a;
            --border-color: #1c3166;
            --glow-color: rgba(2, 132, 199, 0.5);
            --text-main: #e0f2fe;
            --text-sub: #7dd3fc;
            --accent-blue: #0284c7;
        }

        body.theme-light {
            --bg-body: #eef2f6;
            --bg-container: #ffffff;
            --bg-sidebar: #f8fafc;
            --bg-modal: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #e2e8f0;
            --glow-color: rgba(37, 99, 235, 0.3);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-blue: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        @keyframes welcomeCardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .welcome-box {
            background: var(--bg-modal);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px var(--glow-color);
            width: 400px;
            max-width: 92vw;
            animation: welcomeCardEntrance 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-sub {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .avatar-picker-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .avatar-preview-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-input);
            border: 3px solid var(--accent-blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            user-select: none;
        }

        .pencil-btn {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--accent-blue);
            color: white;
            border: 2px solid var(--bg-modal);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.2s, background 0.2s;
        }
        .pencil-btn:hover {
            transform: scale(1.15);
            background: #0056b3;
        }

        .welcome-box input[type="text"] {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            margin-bottom: 20px;
            outline: none;
            font-size: 0.95rem;
            text-align: center;
        }

        .top-right-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 100;
        }

        .control-btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn-top {
            border-color: rgba(255, 71, 87, 0.4);
            color: #ff4757;
        }

        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 82vh;
            background: var(--bg-container);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-width: 0;
            position: relative;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .status-dropdown-container { position: relative; display: inline-block; }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #28a745;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .status-menu {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            z-index: 300;
            min-width: 170px;
            padding: 4px;
        }
        .status-menu.show { display: block; }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #fff;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
        }

        .status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }
        .status-icon.online { background-color: #28a745; }
        .status-icon.dnd { background-color: #dc3545; }
        .status-icon.idle { background-color: #ffcc00; }
        .status-icon.offline { background-color: #6c757d; }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .action-icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
            padding-bottom: 10px;
        }

        #messages li {
            max-width: 85%;
            word-wrap: break-word;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 10px;
            border-left: 3px solid transparent;
        }

        #messages li:hover { background-color: rgba(255, 255, 255, 0.03); }

        /* --- RESALTADO DE MENSAJE MENCIONADO TIPO DISCORD --- */
        #messages li.mentioned-me {
            background-color: var(--mention-bg) !important;
            border-left: 3px solid var(--mention-border) !important;
        }

        .sent-msg { align-self: flex-end; flex-direction: row-reverse; }
        .received-msg { align-self: flex-start; }

        .msg-content-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .msg-bubble {
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            max-width: 100%;
        }

        .msg-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
            gap: 15px;
        }

        /* Etiqueta de Mención en el Texto */
        .mention-tag {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--mention-tag-bg);
            color: var(--mention-tag-text);
            display: inline-block;
        }

        .mention-tag.everyone {
            background: rgba(237, 66, 69, 0.25);
            color: #f8a5a7;
        }

        .msg-image {
            max-width: 280px;
            max-height: 260px;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
            cursor: pointer;
            object-fit: cover;
        }

        .message-reactions-bar {
            display: none;
            position: absolute;
            top: -16px;
            right: 10px;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
            z-index: 50;
        }
        #messages li:hover .message-reactions-bar { display: flex; }

        .react-quick-btn {
            background: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .reactions-display-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }

        .reaction-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            position: relative;
        }

        /* --- POPUP DE AUTOCOMPLETADO DE MENCIONES TIPO DISCORD --- */
        .mentions-autocomplete {
            display: none;
            position: absolute;
            bottom: 110%;
            left: 0;
            width: 320px;
            background: #2b2d31;
            border: 1px solid #1e1f22;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 500;
            max-height: 230px;
            overflow-y: auto;
            padding: 6px 0;
        }
        .mentions-autocomplete.show { display: block; animation: modalFadeIn 0.15s ease-out; }

        .mention-section-header {
            font-size: 0.72rem;
            font-weight: 700;
            color: #949ba4;
            text-transform: uppercase;
            padding: 6px 12px 4px 12px;
            letter-spacing: 0.5px;
        }

        .mention-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .mention-item:hover, .mention-item.selected {
            background: rgba(255, 255, 255, 0.08);
        }

        .mention-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .mention-avatar-wrapper {
            position: relative;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .mention-avatar-wrapper .user-avatar {
            width: 100%;
            height: 100%;
            font-size: 0.75rem;
        }

        .mention-avatar-wrapper .status-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border: 2px solid #2b2d31;
        }

        .mention-user-name {
            font-weight: 600;
            font-size: 0.88rem;
            color: #f2f3f5;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .mention-user-tag {
            font-size: 0.75rem;
            color: #949ba4;
            margin-left: 8px;
            white-space: nowrap;
        }

        /* Visor Imagen Modal */
        .image-viewer-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-in-out;
        }
        .image-viewer-overlay.active { opacity: 1; pointer-events: auto; }
        .image-viewer-content img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }

        .chat-form {
            display: flex;
            position: relative;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
        }

        .attach-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            width: 38px;
            height: 38px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .chat-form input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: transparent;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .emoji-toggle-btn { background: transparent; border: none; font-size: 1.25rem; cursor: pointer; padding: 6px 10px; }

        .chat-form button.main-btn { padding: 10px 20px; border-radius: 8px; width: auto; }

        .users-sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .users-sidebar.collapsed { width: 0 !important; padding: 0 !important; overflow: hidden !important; border-left: none !important; }

        #users-list { list-style: none; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

        #users-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .user-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #000;
            flex-shrink: 0;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="top-right-controls">
        <button class="control-btn" id="admin-trigger">Admin Access</button>
        <button class="control-btn logout-btn-top" id="logout-btn" style="display: none;">Cerrar Sesión</button>
    </div>

    <!-- Modal Admin -->
    <div id="admin-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="background: var(--bg-modal); padding: 25px; border-radius: 12px; width: 320px;">
            <h2>Panel Admin</h2>
            <input type="password" id="admin-pass-input" placeholder="Contraseña..." style="width: 100%; padding: 10px; margin: 15px 0; border-radius: 8px; background: var(--bg-input); color: #fff; border: 1px solid var(--border-color);">
            <button class="main-btn" id="admin-login-btn">Acceder</button>
            <button class="main-btn" id="admin-close-btn" style="background: #333; margin-top: 8px;">Cancelar</button>
        </div>
    </div>

    <!-- Pantalla Bienvenida -->
    <div id="welcome-modal-overlay" class="modal-overlay">
        <div class="welcome-box">
            <h2 class="welcome-title">¡Bienvenido al Chat!</h2>
            <p class="welcome-sub">Personaliza tu perfil para comenzar a conversar</p>

            <input type="file" id="avatar-file-input" accept="image/png, image/jpeg, image/webp" style="display: none;" />

            <div class="avatar-picker-wrapper">
                <div class="avatar-preview-img" id="avatar-preview-box">👤</div>
                <button type="button" class="pencil-btn" id="pencil-avatar-btn" title="Cambiar foto de perfil">✏️</button>
            </div>

            <input type="text" id="nickname-input" placeholder="Escribe tu apodo aquí..." autocomplete="off" maxlength="20">
            <button class="main-btn" id="join-btn" style="width: 100%;">Entrar al Chat</button>
        </div>
    </div>

    <!-- Visor Imagen Modal -->
    <div class="image-viewer-overlay" id="image-viewer">
        <div class="image-viewer-content" style="position: relative;">
            <button class="close-viewer-btn" id="close-viewer-btn" style="position: absolute; top: -15px; right: -15px; background: #000; color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;">✕</button>
            <img id="viewer-full-img" src="" alt="Imagen grande">
        </div>
    </div>

    <!-- Interface Principal -->
    <div class="chat-container">
        <div class="chat-main">
            <div class="chat-header">
                <div class="header-title">
                    <span>Chat online</span>
                    
                    <div class="status-dropdown-container">
                        <div class="online-badge" id="current-status-badge">
                            <span class="status-icon online" id="current-status-icon"></span>
                            <span id="txt-active">Activo</span>
                            <span style="font-size: 0.7rem; margin-left: 2px;">▾</span>
                        </div>
                        <div class="status-menu" id="status-menu">
                            <button class="status-item" data-status="online"><span class="status-icon online"></span> Activo</button>
                            <button class="status-item" data-status="dnd"><span class="status-icon dnd"></span> No molestar</button>
                            <button class="status-item" data-status="idle"><span class="status-icon idle"></span> Ausente</button>
                            <button class="status-item" data-status="offline"><span class="status-icon offline"></span> Desconectado</button>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-icon-btn" id="toggle-sidebar-btn" title="Conectados">👥</button>
                </div>
            </div>
            
            <ul id="messages"></ul>

            <div id="typing-indicator" style="display: none;">
                <span id="typing-text">Alguien está escribiendo</span>
            </div>

            <div id="reply-preview-container" style="display: none;">
                <div class="reply-preview-content">
                    <span id="reply-preview-user" style="font-weight: bold;"></span>
                    <span id="reply-preview-text"></span>
                </div>
                <button id="cancel-reply-btn" style="background: transparent; border: none; color: #fff; cursor: pointer;">✕</button>
            </div>

            <div id="image-preview-container" style="display: none; align-items: center; gap: 8px; padding: 6px;">
                <img id="preview-img-element" src="" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover;">
                <button type="button" id="cancel-image-btn" style="background: #ff4757; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;">✕</button>
            </div>

            <form id="form" class="chat-form">
                <!-- Popup de Menciones Autocompletado tipo Discord -->
                <div class="mentions-autocomplete" id="mentions-popup"></div>
                
                <input type="file" id="image-file-input" accept="image/png, image/jpeg" style="display: none;" />
                <button type="button" class="attach-btn" id="attach-btn">+</button>

                <input type="text" id="input" autocomplete="off" placeholder="Escribe un mensaje... (Usa @ para mencionar)" />
                
                <button type="button" class="emoji-toggle-btn" id="emoji-toggle-btn">😊</button>
                <button class="main-btn" id="btn-send">Enviar</button>
            </form>
        </div>

        <div class="users-sidebar" id="sidebar">
            <h3 style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 12px;">Conectados (<span id="user-count">0</span>)</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const welcomeModalOverlay = document.getElementById('welcome-modal-overlay');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const pencilAvatarBtn = document.getElementById('pencil-avatar-btn');
        const avatarPreviewBox = document.getElementById('avatar-preview-box');
        const logoutBtn = document.getElementById('logout-btn');

        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');

        const currentStatusBadge = document.getElementById('current-status-badge');
        const currentStatusIcon = document.getElementById('current-status-icon');
        const statusMenu = document.getElementById('status-menu');
        const txtActive = document.getElementById('txt-active');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');
        const mentionsPopup = document.getElementById('mentions-popup');

        let myNickname = '';
        let myAvatarBase64 = null;
        let currentUsersData = {};
        let unreadMentionsCount = 0;
        let isWindowFocused = true;

        // Control de Foco de Ventana para Notificaciones en Pestaña
        window.addEventListener('focus', () => {
            isWindowFocused = true;
            unreadMentionsCount = 0;
            document.title = "Chat Online";
        });

        window.addEventListener('blur', () => {
            isWindowFocused = false;
        });

        // Manejo de Fotos e Inicio de Sesión
        pencilAvatarBtn.addEventListener('click', () => avatarFileInput.click());

        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    myAvatarBase64 = evt.target.result;
                    avatarPreviewBox.innerHTML = `<img src="${myAvatarBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        });

        function checkAutoLogin() {
            const savedNickname = localStorage.getItem('chat_nickname');
            const savedAvatar = localStorage.getItem('chat_avatar');

            if (savedNickname) {
                myNickname = savedNickname;
                myAvatarBase64 = savedAvatar || null;
                socket.emit('join', { nickname: myNickname, avatar: myAvatarBase64 });
                welcomeModalOverlay.style.display = 'none';
                logoutBtn.style.display = 'block';
            } else {
                welcomeModalOverlay.style.display = 'flex';
                logoutBtn.style.display = 'none';
            }
        }

        joinBtn.addEventListener('click', () => {
            const name = nicknameInput.value.trim();
            if (name !== '') {
                myNickname = name;
                localStorage.setItem('chat_nickname', myNickname);
                if (myAvatarBase64) localStorage.setItem('chat_avatar', myAvatarBase64);
                
                socket.emit('join', { nickname: myNickname, avatar: myAvatarBase64 });
                welcomeModalOverlay.style.display = 'none';
                logoutBtn.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_nickname');
            localStorage.removeItem('chat_avatar');
            window.location.reload();
        });

        // MENCIONES Y AUTOCOMPLETADO TIPO DISCORD
        input.addEventListener('input', () => {
            const text = input.value;
            const cursorPosition = input.selectionStart;
            const textUpToCursor = text.substring(0, cursorPosition);
            const mentionMatch = textUpToCursor.match(/@([a-zA-Z0-9_]*)$/);

            if (mentionMatch) {
                showMentionsPopup(mentionMatch[1].toLowerCase());
            } else {
                mentionsPopup.classList.remove('show');
            }
        });

        function showMentionsPopup(query) {
            mentionsPopup.innerHTML = '';

            // Opción @everyone
            if ('everyone'.includes(query)) {
                const everyoneDiv = document.createElement('div');
                everyoneDiv.className = 'mention-item';
                everyoneDiv.innerHTML = `
                    <div class="mention-item-left">
                        <div class="mention-avatar-wrapper">
                            <div class="user-avatar" style="background:#ed4245; color:#fff;">📢</div>
                        </div>
                        <div>
                            <span class="mention-user-name" style="color:#f8a5a7;">@everyone</span>
                        </div>
                    </div>
                    <span class="mention-user-tag">Notifica a todos</span>
                `;
                everyoneDiv.addEventListener('click', () => insertMention('@everyone'));
                mentionsPopup.appendChild(everyoneDiv);
            }

            // Encabezado Miembros
            const header = document.createElement('div');
            header.className = 'mention-section-header';
            header.textContent = 'Miembros del canal';
            mentionsPopup.appendChild(header);

            const matchingUsers = Object.values(currentUsersData).filter(u => 
                u.status !== 'offline' && u.nickname.toLowerCase().includes(query)
            );

            matchingUsers.forEach(u => {
                const div = document.createElement('div');
                div.className = 'mention-item';
                const initial = u.nickname.charAt(0).toUpperCase();

                const avatarHtml = u.avatar ? 
                    `<img src="${u.avatar}" class="user-avatar">` : 
                    `<div class="user-avatar" style="background-color: ${u.color}">${initial}</div>`;

                div.innerHTML = `
                    <div class="mention-item-left">
                        <div class="mention-avatar-wrapper">
                            ${avatarHtml}
                            <span class="status-icon ${u.status || 'online'}"></span>
                        </div>
                        <span class="mention-user-name">${u.nickname}</span>
                    </div>
                    <span class="mention-user-tag">@${u.nickname.toLowerCase()}</span>
                `;

                div.addEventListener('click', () => insertMention(`@${u.nickname}`));
                mentionsPopup.appendChild(div);
            });

            mentionsPopup.classList.add('show');
        }

        function insertMention(mentionText) {
            const text = input.value;
            const cursorPosition = input.selectionStart;
            const textUpToCursor = text.substring(0, cursorPosition);
            const lastAtIndex = textUpToCursor.lastIndexOf('@');
            
            input.value = text.substring(0, lastAtIndex) + `${mentionText} ` + text.substring(cursorPosition);
            mentionsPopup.classList.remove('show');
            input.focus();
        }

        function formatMentions(text) {
            if (!text) return '';
            let formattedText = text;

            // Mención a @everyone
            const everyoneRegex = /@everyone\b/gi;
            formattedText = formattedText.replace(everyoneRegex, `<span class="mention-tag everyone">@everyone</span>`);

            // Menciones a Usuarios
            Object.values(currentUsersData).forEach(u => {
                const mentionRegex = new RegExp(`@${u.nickname}\\b`, 'gi');
                if (mentionRegex.test(formattedText)) {
                    formattedText = formattedText.replace(mentionRegex, `<span class="mention-tag">@${u.nickname}</span>`);
                }
            });

            return formattedText;
        }

        // ENVIAR MENSAJES Y RECIBIR
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                const now = new Date();
                socket.emit('chat message', {
                    text: input.value,
                    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                input.value = '';
                mentionsPopup.classList.remove('show');
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.id = data.id;

            const isMe = (data.senderId === socket.id);
            item.className = isMe ? 'sent-msg' : 'received-msg';

            // Detección si FUI MENCIONADO o usaron @everyone
            const isMentioned = data.text && (
                data.text.includes(`@${myNickname}`) || 
                data.text.toLowerCase().includes('@everyone')
            );

            if (isMentioned && !isMe) {
                item.classList.add('mentioned-me');

                // Si la ventana no tiene foco, actualizar contador en la pestaña (1) Chat Online
                if (!isWindowFocused) {
                    unreadMentionsCount++;
                    document.title = `(${unreadMentionsCount}) Chat Online`;
                }
            }

            const initial = data.user ? data.user.charAt(0).toUpperCase() : '?';
            const userAvatarHtml = data.avatar ? 
                `<img src="${data.avatar}" class="user-avatar">` : 
                `<div class="user-avatar" style="background-color: ${data.color}">${initial}</div>`;

            const formattedMessageText = formatMentions(data.text);

            item.innerHTML = `
                ${userAvatarHtml}
                <div class="msg-content-wrapper">
                    <div class="msg-bubble" style="background-color: ${data.color}">
                        <div class="msg-info">
                            <span><strong>${data.user}</strong></span>
                            <span>${data.time}</span>
                        </div>
                        <span class="msg-text-content">${formattedMessageText}</span>
                    </div>
                </div>
            `;

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('update-users', (usersObj) => {
            currentUsersData = usersObj;
            usersList.innerHTML = '';
            const entries = Object.entries(usersObj);
            userCount.textContent = entries.length;

            entries.forEach(([id, uData]) => {
                const li = document.createElement('li');
                const initial = uData.nickname ? uData.nickname.charAt(0).toUpperCase() : '?';
                const avatarHtml = uData.avatar ? 
                    `<img src="${uData.avatar}" class="user-avatar">` : 
                    `<div class="user-avatar" style="background-color: ${uData.color}">${initial}</div>`;

                li.innerHTML = `
                    <div class="user-left">
                        ${avatarHtml}
                        <span style="color: ${uData.color}; font-weight: bold;">${uData.nickname}</span>
                    </div>
                `;
                usersList.appendChild(li);
            });
        });

        toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

        checkAutoLogin();
    </script>
</body>
</html>
