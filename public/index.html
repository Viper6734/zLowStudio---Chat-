<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0b0b0e;
            --bg-container: #111115;
            --bg-sidebar: #16161c;
            --bg-modal: #141418;
            --bg-input: #181820;
            --border-color: #1f1f26;
            --glow-color: rgba(0, 123, 255, 0.4);
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-blue: #007bff;
            --font-family: 'Inter', sans-serif;

            --mention-bg: rgba(250, 166, 26, 0.12);
            --mention-border: #faa61a;
            --mention-tag-bg: rgba(88, 101, 242, 0.3);
            --mention-tag-text: #c9cdfb;
        }

        body.theme-cyberpunk {
            --bg-body: #0d0221;
            --bg-container: #0f0826;
            --bg-sidebar: #180e36;
            --bg-modal: #1c103f;
            --bg-input: #261654;
            --border-color: #ff0055;
            --glow-color: rgba(255, 0, 85, 0.6);
            --text-main: #00f6ff;
            --text-sub: #ff77a9;
            --accent-blue: #ff0055;
        }

        body.theme-midnight {
            --bg-body: #030814;
            --bg-container: #0a1128;
            --bg-sidebar: #0f1c3f;
            --bg-modal: #13224f;
            --bg-input: #1c2d5a;
            --border-color: #1c3166;
            --glow-color: rgba(2, 132, 199, 0.5);
            --text-main: #e0f2fe;
            --text-sub: #7dd3fc;
            --accent-blue: #0284c7;
        }

        body.theme-light {
            --bg-body: #eef2f6;
            --bg-container: #ffffff;
            --bg-sidebar: #f8fafc;
            --bg-modal: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #e2e8f0;
            --glow-color: rgba(37, 99, 235, 0.3);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-blue: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: var(--bg-modal);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
            width: 380px;
            max-width: 90vw;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes welcomeCardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .welcome-box {
            background: var(--bg-modal);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px var(--glow-color);
            width: 400px;
            max-width: 92vw;
            animation: welcomeCardEntrance 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-sub {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .avatar-picker-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .avatar-preview-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-input);
            border: 3px solid var(--accent-blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            user-select: none;
        }

        .pencil-btn {
            position: absolute;
            bottom: 2px; right: 2px;
            background: var(--accent-blue);
            color: white;
            border: 2px solid var(--bg-modal);
            border-radius: 50%;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.2s, background 0.2s;
        }
        .pencil-btn:hover { transform: scale(1.15); background: #0056b3; }

        .welcome-box input[type="text"] {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            margin-bottom: 20px;
            outline: none;
            font-size: 0.95rem;
            text-align: center;
        }

        .top-right-controls {
            position: absolute;
            top: 15px; right: 20px;
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 8px; z-index: 100;
        }

        .control-btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn-top { border-color: rgba(255, 71, 87, 0.4); color: #ff4757; }

        .settings-modal-box { width: 650px; max-width: 95vw; text-align: left; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }

        @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box h2 { margin-bottom: 15px; font-size: 1.4rem; }
        .modal-box p { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.4; }

        .modal-box input {
            width: 100%; padding: 12px;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-input); color: var(--text-main);
            margin-bottom: 15px; outline: none;
        }

        .setting-card {
            background: var(--bg-input); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px;
        }

        .setting-card label { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }
        .setting-options { display: flex; gap: 8px; flex-wrap: wrap; }

        .opt-btn {
            flex: 1; padding: 8px; background: var(--bg-modal);
            border: 1px solid var(--border-color); color: var(--text-main);
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; text-align: center;
        }

        .opt-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }

        .modal-box button.main-btn, .main-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: var(--accent-blue); color: white; font-weight: bold; font-size: 0.95rem; cursor: pointer;
        }

        .chat-container {
            display: flex; width: 100%; max-width: 1000px; height: 82vh;
            background: var(--bg-container); border-radius: 16px; border: 2px solid var(--border-color);
            overflow: hidden; position: relative;
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; padding: 20px; min-width: 0; position: relative; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        .header-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }

        .status-dropdown-container { position: relative; display: inline-block; }

        .online-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(40, 167, 69, 0.15); border: 1px solid rgba(40, 167, 69, 0.3);
            color: #28a745; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
        }

        .status-menu {
            display: none; position: absolute; top: 110%; left: 0; background: #1a1a24;
            border: 1px solid var(--border-color); border-radius: 10px; z-index: 300; min-width: 170px; padding: 4px;
        }
        .status-menu.show { display: block; animation: modalFadeIn 0.15s ease-out; }

        .status-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            font-size: 0.85rem; color: #fff; background: transparent; border: none; width: 100%; text-align: left; cursor: pointer; border-radius: 6px;
        }

        .status-icon { width: 12px; height: 12px; border-radius: 50%; display: inline-block; position: relative; }
        .status-icon.online { background-color: #28a745; }
        .status-icon.dnd { background-color: #dc3545; }
        .status-icon.idle { background-color: #ffcc00; }
        .status-icon.offline { background-color: #6c757d; }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .action-icon-btn {
            background: var(--bg-input); border: 1px solid var(--border-color);
            font-size: 1.1rem; cursor: pointer; color: var(--text-main); padding: 6px 10px; border-radius: 8px;
        }

        #messages {
            flex: 1; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; padding-bottom: 10px;
        }

        #messages li {
            max-width: 85%; word-wrap: break-word; position: relative; transition: all 0.3s ease;
            display: flex; align-items: flex-end; gap: 8px; padding: 6px 10px; border-radius: 10px; border-left: 3px solid transparent;
        }

        #messages li:hover { background-color: rgba(255, 255, 255, 0.03); }

        #messages li.mentioned-me {
            background-color: var(--mention-bg) !important;
            border-left: 3px solid var(--mention-border) !important;
        }

        .sent-msg { align-self: flex-end; flex-direction: row-reverse; }
        .received-msg { align-self: flex-start; }

        .msg-content-wrapper { position: relative; display: flex; flex-direction: column; max-width: 100%; }

        .msg-bubble {
            color: #ffffff; padding: 12px 16px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; max-width: 100%;
        }

        .msg-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: rgba(255, 255, 255, 0.85); margin-bottom: 4px; gap: 15px; }

        .mention-tag { font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--mention-tag-bg); color: var(--mention-tag-text); display: inline-block; }
        .mention-tag.everyone { background: rgba(237, 66, 69, 0.25); color: #f8a5a7; }

        .msg-image { max-width: 280px; max-height: 260px; border-radius: 8px; margin-top: 6px; display: block; cursor: pointer; object-fit: cover; }

        /* REPRODUCTOR DE AUDIO DENTRO DEL CHAT */
        .audio-player-wrapper {
            display: flex; align-items: center; gap: 10px; padding: 6px 0; min-width: 210px;
        }
        .audio-player-wrapper audio {
            height: 36px; outline: none; border-radius: 18px; filter: invert(0.9) hue-rotate(180deg); flex: 1;
        }

        .message-reactions-bar {
            display: none; position: absolute; top: -16px; right: 10px;
            background: #1a1a24; border: 1px solid var(--border-color); border-radius: 8px; padding: 2px; gap: 2px; z-index: 50;
        }
        #messages li:hover .message-reactions-bar { display: flex; }

        .react-quick-btn { background: transparent; border: none; font-size: 1rem; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
        .reactions-display-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

        .reaction-pill {
            display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; position: relative;
        }

        .mentions-autocomplete {
            display: none; position: absolute; bottom: 110%; left: 0; width: 320px;
            background: #2b2d31; border: 1px solid #1e1f22; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 500; max-height: 230px; overflow-y: auto; padding: 6px 0;
        }
        .mentions-autocomplete.show { display: block; animation: modalFadeIn 0.15s ease-out; }

        .mention-section-header { font-size: 0.72rem; font-weight: 700; color: #949ba4; text-transform: uppercase; padding: 6px 12px 4px 12px; }
        .mention-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; }
        .mention-item:hover { background: rgba(255, 255, 255, 0.08); }
        .mention-item-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .mention-avatar-wrapper { position: relative; width: 28px; height: 28px; flex-shrink: 0; }
        .mention-avatar-wrapper .user-avatar { width: 100%; height: 100%; font-size: 0.75rem; }
        .mention-user-name { font-weight: 600; font-size: 0.88rem; color: #f2f3f5; }
        .mention-user-tag { font-size: 0.75rem; color: #949ba4; margin-left: 8px; }

        .image-viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease-in-out;
        }
        .image-viewer-overlay.active { opacity: 1; pointer-events: auto; }
        .image-viewer-content img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }

        /* BARRA DE GRABACIÓN DE AUDIO EN VIVO CON CANVAS */
        #audio-recording-bar {
            display: none; align-items: center; gap: 12px; width: 100%; background: var(--bg-input);
            border: 1px solid var(--accent-blue); padding: 6px 14px; border-radius: 10px; animation: modalFadeIn 0.2s ease-out;
        }
        #audio-recording-bar.active { display: flex; }

        .rec-dot-animated {
            width: 12px; height: 12px; background: #ff4757; border-radius: 50%;
            animation: pulseRec 1s infinite alternate; flex-shrink: 0;
        }
        @keyframes pulseRec { from { transform: scale(0.8); opacity: 0.5; } to { transform: scale(1.2); opacity: 1; } }

        #audio-wave-canvas { flex: 1; height: 32px; background: transparent; }
        .rec-timer { font-size: 0.85rem; font-weight: 700; color: #ff4757; font-family: monospace; }
        .cancel-rec-btn { background: transparent; border: none; color: #ff4757; cursor: pointer; font-size: 1.1rem; padding: 4px; }

        .chat-form { display: flex; position: relative; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 10px; padding: 4px; }
        .attach-btn { background: transparent; border: none; color: var(--text-sub); width: 38px; height: 38px; font-size: 1.5rem; cursor: pointer; }
        .chat-form input[type="text"] { flex: 1; padding: 10px 12px; border: none; background: transparent; color: var(--text-main); outline: none; font-size: 0.95rem; }
        .emoji-toggle-btn { background: transparent; border: none; font-size: 1.25rem; cursor: pointer; padding: 6px 10px; }

        /* BOTÓN DINÁMICO: ENVIAR O MICRÓFONO */
        .dynamic-send-btn {
            padding: 10px 16px; border: none; border-radius: 8px; background: var(--accent-blue);
            color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .dynamic-send-btn:hover { filter: brightness(1.15); }
        .dynamic-send-btn.recording { background: #ff4757 !important; animation: pulseRec 1s infinite alternate; }

        .users-sidebar { width: 280px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; }
        .users-sidebar.collapsed { width: 0 !important; padding: 0 !important; overflow: hidden !important; border-left: none !important; }

        #users-list { list-style: none; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        #users-list li { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 8px 12px; border-radius: 8px; }
        .user-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }

        .user-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; color: #000; flex-shrink: 0; object-fit: cover; }
    </style>
</head>
<body>

    <div class="top-right-controls">
        <button class="control-btn" id="admin-trigger">Admin Access</button>
        <button class="control-btn logout-btn-top" id="logout-btn" style="display: none;">Cerrar Sesión</button>
    </div>

    <!-- Modal Admin -->
    <div id="admin-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="background: var(--bg-modal); padding: 25px; border-radius: 12px; width: 320px;">
            <h2>Panel Admin</h2>
            <input type="password" id="admin-pass-input" placeholder="Contraseña..." style="width: 100%; padding: 10px; margin: 15px 0; border-radius: 8px; background: var(--bg-input); color: #fff; border: 1px solid var(--border-color);">
            <button class="main-btn" id="admin-login-btn">Acceder</button>
            <button class="main-btn" id="admin-close-btn" style="background: #333; margin-top: 8px;">Cancelar</button>
        </div>
    </div>

    <!-- Modal SETTINGS -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box settings-modal-box">
            <h2 id="st-title">⚙️ Configuración</h2>
            <p style="margin-bottom: 15px; font-size: 0.85rem;">Personaliza tu experiencia de chat.</p>
            
            <div class="settings-grid">
                <div class="setting-card">
                    <label id="st-label-theme">Tema de Interfaz</label>
                    <div class="setting-options">
                        <button class="opt-btn theme-opt active" data-val="default">Oscuro</button>
                        <button class="opt-btn theme-opt" data-val="cyberpunk">Cyber</button>
                        <button class="opt-btn theme-opt" data-val="midnight">Midnight</button>
                        <button class="opt-btn theme-opt" data-val="light">Claro</button>
                    </div>
                </div>

                <div class="setting-card">
                    <label id="st-label-lang">Idioma</label>
                    <div class="setting-options">
                        <button class="opt-btn lang-opt active" data-val="es">Español</button>
                        <button class="opt-btn lang-opt" data-val="en">English</button>
                    </div>
                </div>

                <div class="setting-card">
                    <label id="st-label-sound">Sonido de Notificación</label>
                    <div class="setting-options">
                        <button class="opt-btn sound-opt active" data-val="synth">Pop Synth</button>
                        <button class="opt-btn sound-opt" data-val="bubbles">Burbujas Pop</button>
                    </div>
                </div>
            </div>

            <button class="main-btn" id="close-settings-btn">Guardar y Cerrar</button>
        </div>
    </div>

    <!-- Pantalla Bienvenida -->
    <div id="welcome-modal-overlay" class="modal-overlay">
        <div class="welcome-box">
            <h2 class="welcome-title">¡Bienvenido al Chat!</h2>
            <p class="welcome-sub">Personaliza tu perfil para comenzar a conversar</p>

            <input type="file" id="avatar-file-input" accept="image/png, image/jpeg, image/webp" style="display: none;" />

            <div class="avatar-picker-wrapper">
                <div class="avatar-preview-img" id="avatar-preview-box">👤</div>
                <button type="button" class="pencil-btn" id="pencil-avatar-btn" title="Cambiar foto de perfil">✏️</button>
            </div>

            <input type="text" id="nickname-input" placeholder="Escribe tu apodo aquí..." autocomplete="off" maxlength="20">
            <button class="main-btn" id="join-btn" style="width: 100%;">Entrar al Chat</button>
        </div>
    </div>

    <!-- Visor Imagen Modal -->
    <div class="image-viewer-overlay" id="image-viewer">
        <div class="image-viewer-content" style="position: relative;">
            <button class="close-viewer-btn" id="close-viewer-btn" style="position: absolute; top: -15px; right: -15px; background: #000; color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;">✕</button>
            <img id="viewer-full-img" src="" alt="Imagen grande">
        </div>
    </div>

    <!-- Interface Principal -->
    <div class="chat-container">
        <div class="chat-main">
            <div class="chat-header">
                <div class="header-title">
                    <span>Chat online</span>
                    <div class="status-dropdown-container">
                        <div class="online-badge" id="current-status-badge">
                            <span class="status-icon online" id="current-status-icon"></span>
                            <span id="txt-active">Activo</span>
                            <span style="font-size: 0.7rem; margin-left: 2px;">▾</span>
                        </div>
                        <div class="status-menu" id="status-menu">
                            <button class="status-item" data-status="online"><span class="status-icon online"></span> Activo</button>
                            <button class="status-item" data-status="dnd"><span class="status-icon dnd"></span> No molestar</button>
                            <button class="status-item" data-status="idle"><span class="status-icon idle"></span> Ausente</button>
                            <button class="status-item" data-status="offline"><span class="status-icon offline"></span> Desconectado</button>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-icon-btn" id="open-settings-btn" title="Settings">⚙️</button>
                    <button class="action-icon-btn" id="toggle-sidebar-btn" title="Conectados">👥</button>
                </div>
            </div>
            
            <ul id="messages"></ul>

            <div id="typing-indicator" style="display: none;">
                <span id="typing-text">Alguien está escribiendo</span>
            </div>

            <div id="reply-preview-container" style="display: none;">
                <div class="reply-preview-content">
                    <span id="reply-preview-user" style="font-weight: bold;"></span>
                    <span id="reply-preview-text"></span>
                </div>
                <button id="cancel-reply-btn" style="background: transparent; border: none; color: #fff; cursor: pointer;">✕</button>
            </div>

            <div id="image-preview-container" style="display: none; align-items: center; gap: 8px; padding: 6px;">
                <img id="preview-img-element" src="" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover;">
                <button type="button" id="cancel-image-btn" style="background: #ff4757; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;">✕</button>
            </div>

            <!-- BARRA DE GRABACIÓN DE AUDIO EN TIEMPO REAL -->
            <div id="audio-recording-bar">
                <div class="rec-dot-animated"></div>
                <span class="rec-timer" id="rec-timer">00:00</span>
                <canvas id="audio-wave-canvas"></canvas>
                <button type="button" class="cancel-rec-btn" id="cancel-rec-btn" title="Cancelar grabación">🗑️</button>
            </div>

            <form id="form" class="chat-form">
                <div class="mentions-autocomplete" id="mentions-popup"></div>
                
                <input type="file" id="image-file-input" accept="image/png, image/jpeg" style="display: none;" />
                <button type="button" class="attach-btn" id="attach-btn">+</button>

                <input type="text" id="input" autocomplete="off" placeholder="Escribe un mensaje... (Usa @ para mencionar)" />
                
                <button type="button" class="emoji-toggle-btn" id="emoji-toggle-btn">😊</button>
                
                <!-- BOTÓN DINÁMICO: CAMBIA ENTRE MICRÓFONO Y ENVIAR -->
                <button type="button" class="dynamic-send-btn" id="dynamic-send-btn">🎙️</button>
            </form>
        </div>

        <div class="users-sidebar" id="sidebar">
            <h3 style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 12px;">Conectados (<span id="user-count">0</span>)</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const welcomeModalOverlay = document.getElementById('welcome-modal-overlay');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const pencilAvatarBtn = document.getElementById('pencil-avatar-btn');
        const avatarPreviewBox = document.getElementById('avatar-preview-box');
        const logoutBtn = document.getElementById('logout-btn');

        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');

        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');

        const currentStatusBadge = document.getElementById('current-status-badge');
        const currentStatusIcon = document.getElementById('current-status-icon');
        const statusMenu = document.getElementById('status-menu');
        const txtActive = document.getElementById('txt-active');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');
        const mentionsPopup = document.getElementById('mentions-popup');

        const dynamicSendBtn = document.getElementById('dynamic-send-btn');
        const audioRecordingBar = document.getElementById('audio-recording-bar');
        const recTimer = document.getElementById('rec-timer');
        const audioWaveCanvas = document.getElementById('audio-wave-canvas');
        const cancelRecBtn = document.getElementById('cancel-rec-btn');

        let myNickname = '';
        let myAvatarBase64 = null;
        let currentUsersData = {};
        let unreadMentionsCount = 0;
        let isWindowFocused = true;

        // GRABACIÓN DE AUDIO WEB AUDIO API
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recInterval = null;
        let recSeconds = 0;
        let audioCtx = null;
        let analyser = null;
        let animFrameId = null;

        window.addEventListener('focus', () => {
            isWindowFocused = true;
            unreadMentionsCount = 0;
            document.title = "Chat Online";
        });
        window.addEventListener('blur', () => { isWindowFocused = false; });

        // CAMBIAR ICONO DEL BOTÓN SEGÚN CONTENIDO DE LA BARRA
        input.addEventListener('input', updateSendButtonState);

        function updateSendButtonState() {
            if (isRecording) return;
            if (input.value.trim().length > 0) {
                dynamicSendBtn.textContent = 'Enviar';
                dynamicSendBtn.style.padding = '10px 20px';
            } else {
                dynamicSendBtn.textContent = '🎙️';
                dynamicSendBtn.style.padding = '10px 14px';
            }
        }

        // LÓGICA DE GRABACIÓN DE AUDIO
        dynamicSendBtn.addEventListener('click', () => {
            if (input.value.trim().length > 0) {
                // Enviar texto habitual
                form.dispatchEvent(new Event('submit'));
            } else {
                // Activar/Detener Nota de Voz
                if (!isRecording) {
                    startAudioRecording();
                } else {
                    stopAndSendAudioRecording();
                }
            }
        });

        async function startAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.start();

                isRecording = true;
                dynamicSendBtn.textContent = '✓';
                dynamicSendBtn.classList.add('recording');
                audioRecordingBar.classList.add('active');

                playAudioFeedback(600, 900); // Sonido de inicio

                recSeconds = 0;
                recTimer.textContent = '00:00';
                recInterval = setInterval(() => {
                    recSeconds++;
                    const mins = String(Math.floor(recSeconds / 60)).padStart(2, '0');
                    const secs = String(recSeconds % 60).padStart(2, '0');
                    recTimer.textContent = `${mins}:${secs}`;
                }, 1000);

                setupAudioAnalyser(stream);
            } catch (err) {
                alert('No se pudo acceder al micrófono para grabar audio.');
            }
        }

        function setupAudioAnalyser(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);
            analyser.fftSize = 64;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const canvasCtx = audioWaveCanvas.getContext('2d');

            function drawWave() {
                animFrameId = requestAnimationFrame(drawWave);
                analyser.getByteFrequencyData(dataArray);

                canvasCtx.clearRect(0, 0, audioWaveCanvas.width, audioWaveCanvas.height);
                const barWidth = (audioWaveCanvas.width / bufferLength) * 2;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * audioWaveCanvas.height;
                    canvasCtx.fillStyle = '#007bff';
                    canvasCtx.fillRect(x, audioWaveCanvas.height - barHeight, barWidth - 2, barHeight);
                    x += barWidth;
                }
            }
            drawWave();
        }

        function stopAndSendAudioRecording() {
            if (!mediaRecorder) return;

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Audio = reader.result;
                    const now = new Date();
                    socket.emit('chat message', {
                        text: '',
                        audio: base64Audio,
                        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    playAudioFeedback(900, 1200); // Sonido satisfatorio de envío
                };
                reader.readAsDataURL(audioBlob);
                cleanupRecording();
            };
            mediaRecorder.stop();
        }

        cancelRecBtn.addEventListener('click', () => {
            if (mediaRecorder) {
                mediaRecorder.onstop = null;
                mediaRecorder.stop();
            }
            playAudioFeedback(400, 200); // Sonido de cancelación
            cleanupRecording();
        });

        function cleanupRecording() {
            isRecording = false;
            clearInterval(recInterval);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (audioCtx) audioCtx.close();

            dynamicSendBtn.classList.remove('recording');
            audioRecordingBar.classList.remove('active');
            updateSendButtonState();
        }

        function playAudioFeedback(freq1, freq2) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq1, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq2, ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        // PERFIL PERSISTENTE
        pencilAvatarBtn.addEventListener('click', () => avatarFileInput.click());
        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    myAvatarBase64 = evt.target.result;
                    avatarPreviewBox.innerHTML = `<img src="${myAvatarBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        });

        function checkAutoLogin() {
            const savedNickname = localStorage.getItem('chat_nickname');
            const savedAvatar = localStorage.getItem('chat_avatar');

            if (savedNickname) {
                myNickname = savedNickname;
                myAvatarBase64 = savedAvatar || null;
                socket.emit('join', { nickname: myNickname, avatar: myAvatarBase64 });
                welcomeModalOverlay.style.display = 'none';
                logoutBtn.style.display = 'block';
            } else {
                welcomeModalOverlay.style.display = 'flex';
                logoutBtn.style.display = 'none';
            }
        }

        joinBtn.addEventListener('click', () => {
            const name = nicknameInput.value.trim();
            if (name !== '') {
                myNickname = name;
                localStorage.setItem('chat_nickname', myNickname);
                if (myAvatarBase64) localStorage.setItem('chat_avatar', myAvatarBase64);
                
                socket.emit('join', { nickname: myNickname, avatar: myAvatarBase64 });
                welcomeModalOverlay.style.display = 'none';
                logoutBtn.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('chat_nickname');
            localStorage.removeItem('chat_avatar');
            window.location.reload();
        });

        // IMPRESIÓN DE MENSAJES Y AUDIOS DENTRO DEL CHAT
        socket.on('chat message', (data) => {
            playMessageSound();

            const item = document.createElement('li');
            item.id = data.id;

            const isMe = (data.senderId === socket.id);
            item.className = isMe ? 'sent-msg' : 'received-msg';

            const isMentioned = data.text && (data.text.includes(`@${myNickname}`) || data.text.toLowerCase().includes('@everyone'));
            if (isMentioned && !isMe) {
                item.classList.add('mentioned-me');
                if (!isWindowFocused) {
                    unreadMentionsCount++;
                    document.title = `(${unreadMentionsCount}) Chat Online`;
                }
            }

            const initial = data.user ? data.user.charAt(0).toUpperCase() : '?';
            const userAvatarHtml = data.avatar ? 
                `<img src="${data.avatar}" class="user-avatar" title="${data.user}">` : 
                `<div class="user-avatar" style="background-color: ${data.color}">${initial}</div>`;

            let audioHtml = '';
            if (data.audio) {
                audioHtml = `
                    <div class="audio-player-wrapper">
                        <span>🎙️</span>
                        <audio controls src="${data.audio}"></audio>
                    </div>
                `;
            }

            let imageHtml = data.image ? `<img src="${data.image}" class="msg-image" onclick="openImageViewer(this.src)" />` : '';

            item.innerHTML = `
                ${userAvatarHtml}
                <div class="msg-content-wrapper">
                    <div class="msg-bubble" style="background-color: ${data.color}">
                        <div class="msg-info">
                            <span><strong>${data.user}</strong></span>
                            <div style="display: flex; align-items: center; gap: 5px;">
                                <span>${data.time}</span>
                                ${(isMe) ? `<button onclick="deleteMsg('${data.id}')" style="background:transparent; border:none; color:#ff4757; cursor:pointer; font-size:0.8rem; margin-left:4px;">🗑️</button>` : ''}
                            </div>
                        </div>
                        ${data.text ? `<span class="msg-text-content">${formatMentions(data.text)}</span>` : ''}
                        ${audioHtml}
                        ${imageHtml}
                    </div>
                </div>
            `;

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        function deleteMsg(id) {
            socket.emit('delete message', id);
        }

        socket.on('message deleted', (msgId) => {
            const el = document.getElementById(msgId);
            if (el) el.remove();
        });

        function formatMentions(text) {
            if (!text) return '';
            let formattedText = text;
            formattedText = formattedText.replace(/@everyone\b/gi, `<span class="mention-tag everyone">@everyone</span>`);
            Object.values(currentUsersData).forEach(u => {
                const mentionRegex = new RegExp(`@${u.nickname}\\b`, 'gi');
                if (mentionRegex.test(formattedText)) {
                    formattedText = formattedText.replace(mentionRegex, `<span class="mention-tag">@${u.nickname}</span>`);
                }
            });
            return formattedText;
        }

        socket.on('update-users', (usersObj) => {
            currentUsersData = usersObj;
            usersList.innerHTML = '';
            const entries = Object.entries(usersObj);
            userCount.textContent = entries.length;

            entries.forEach(([id, uData]) => {
                const li = document.createElement('li');
                const initial = uData.nickname ? uData.nickname.charAt(0).toUpperCase() : '?';
                const avatarHtml = uData.avatar ? 
                    `<img src="${uData.avatar}" class="user-avatar">` : 
                    `<div class="user-avatar" style="background-color: ${uData.color}">${initial}</div>`;

                li.innerHTML = `
                    <div class="user-left">
                        ${avatarHtml}
                        <span style="color: ${uData.color}; font-weight: bold;">${uData.nickname}</span>
                    </div>
                `;
                usersList.appendChild(li);
            });
        });

        toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
        openSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
        closeSettingsBtn.addEventListener('click', () => settingsModal.style.display = 'none');

        checkAutoLogin();
    </script>
</body>
</html>
