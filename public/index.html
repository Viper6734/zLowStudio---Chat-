<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0b0b0e;
            --bg-container: #111115;
            --bg-sidebar: #16161c;
            --bg-modal: #141418;
            --bg-input: #2b2d31;
            --border-color: #1f1f26;
            --glow-color: rgba(0, 123, 255, 0.4);
            --text-main: #ffffff;
            --text-sub: #949ba4;
            --accent-blue: #5865f2;
            --font-family: 'Inter', sans-serif;

            --mention-bg: rgba(250, 166, 26, 0.12);
            --mention-border: #faa61a;
            --mention-tag-bg: rgba(88, 101, 242, 0.3);
            --mention-tag-text: #c9cdfb;
        }

        body.theme-cyberpunk {
            --bg-body: #0d0221;
            --bg-container: #0f0826;
            --bg-sidebar: #180e36;
            --bg-modal: #1c103f;
            --bg-input: #261654;
            --border-color: #ff0055;
            --glow-color: rgba(255, 0, 85, 0.6);
            --text-main: #00f6ff;
            --text-sub: #ff77a9;
            --accent-blue: #ff0055;
        }

        body.theme-midnight {
            --bg-body: #030814;
            --bg-container: #0a1128;
            --bg-sidebar: #0f1c3f;
            --bg-modal: #13224f;
            --bg-input: #1c2d5a;
            --border-color: #1c3166;
            --glow-color: rgba(2, 132, 199, 0.5);
            --text-main: #e0f2fe;
            --text-sub: #7dd3fc;
            --accent-blue: #0284c7;
        }

        body.theme-light {
            --bg-body: #eef2f6;
            --bg-container: #ffffff;
            --bg-sidebar: #f8fafc;
            --bg-modal: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #e2e8f0;
            --glow-color: rgba(37, 99, 235, 0.3);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-blue: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        ::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: var(--bg-modal);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
            width: 380px;
            max-width: 90vw;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes welcomeCardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .welcome-box {
            background: var(--bg-modal);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px var(--glow-color);
            width: 400px;
            max-width: 92vw;
            animation: welcomeCardEntrance 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-sub {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .avatar-picker-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        .avatar-preview-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-input);
            border: 3px solid var(--accent-blue);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            user-select: none;
        }

        .pencil-btn {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--accent-blue);
            color: white;
            border: 2px solid var(--bg-modal);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: transform 0.2s, background 0.2s;
        }
        .pencil-btn:hover {
            transform: scale(1.15);
            background: #0056b3;
        }

        .welcome-box input[type="text"] {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            margin-bottom: 20px;
            outline: none;
            font-size: 0.95rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        .top-right-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 100;
        }

        .control-btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .control-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-main);
        }

        .logout-btn-top {
            border-color: rgba(255, 71, 87, 0.4);
            color: #ff4757;
        }
        .logout-btn-top:hover {
            background: #ff4757;
            color: white;
            border-color: #ff4757;
        }

        .settings-modal-box {
            width: 650px;
            max-width: 95vw;
            text-align: left;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .settings-grid { grid-template-columns: 1fr; }
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box h2 { margin-bottom: 15px; font-size: 1.4rem; }
        .modal-box p { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 20px; line-height: 1.4; }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            margin-bottom: 15px;
            outline: none;
        }

        .setting-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-card label {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .setting-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .opt-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg-modal);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
        }

        .opt-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .modal-box button.main-btn, .main-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent-blue);
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: filter 0.2s;
        }

        @keyframes borderPulseGlow {
            0% {
                box-shadow: 0 0 10px var(--border-color), inset 0 0 5px var(--border-color), 0 0 20px var(--glow-color);
                border-color: var(--border-color);
            }
            50% {
                box-shadow: 0 0 25px var(--glow-color), inset 0 0 12px var(--glow-color), 0 0 35px var(--glow-color);
                border-color: var(--accent-blue);
            }
            100% {
                box-shadow: 0 0 10px var(--border-color), inset 0 0 5px var(--border-color), 0 0 20px var(--glow-color);
                border-color: var(--border-color);
            }
        }

        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 82vh;
            background: var(--bg-container);
            border-radius: 16px;
            border: 2px solid var(--border-color);
            overflow: hidden;
            position: relative;
            animation: borderPulseGlow 4s infinite ease-in-out;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-width: 0;
            position: relative;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .status-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(40, 167, 69, 0.15);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #28a745;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .online-badge:hover { filter: brightness(1.15); }

        .status-menu {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            z-index: 300;
            min-width: 170px;
            overflow: hidden;
            padding: 4px;
        }
        .status-menu.show { display: block; animation: modalFadeIn 0.15s ease-out; }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #fff;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
        }
        .status-item:hover { background: rgba(255,255,255,0.08); }

        .status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            position: relative;
        }

        .status-icon.online {
            background-color: #28a745;
            box-shadow: 0 0 6px #28a745;
        }

        .status-icon.dnd {
            background-color: #dc3545;
            box-shadow: 0 0 6px #dc3545;
        }
        .status-icon.dnd::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 2px;
            width: 8px;
            height: 2px;
            background-color: #111115;
            border-radius: 1px;
        }

        .status-icon.idle {
            background-color: #ffcc00;
            box-shadow: 0 0 6px #ffcc00;
        }

        .status-icon.offline {
            background-color: #6c757d;
            border: 2px solid #111115;
            box-sizing: border-box;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-icon-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.05);
        }

        @keyframes sentBubble {
            0% { opacity: 0; transform: scale(0.2) translateY(30px) rotate(-5deg); }
            70% { transform: scale(1.05) translateY(-3px) rotate(1deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        @keyframes receivedBubble {
            0% { opacity: 0; transform: translateX(-40px) scaleX(0.8); }
            70% { transform: translateX(5px) scaleX(1.02); }
            100% { opacity: 1; transform: translateX(0) scaleX(1); }
        }

        @keyframes dissolveOut {
            0% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
            50% { opacity: 0.5; transform: scale(0.95) translateY(-5px); filter: blur(3px); }
            100% { opacity: 0; transform: scale(0.8) translateY(-15px); filter: blur(8px); max-height: 0; padding: 0; margin: 0; }
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
            padding-bottom: 10px;
        }

        #messages li {
            max-width: 85%;
            word-wrap: break-word;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 10px;
            border-left: 3px solid transparent;
        }

        #messages li:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        #messages li.mentioned-me {
            background-color: var(--mention-bg) !important;
            border-left: 3px solid var(--mention-border) !important;
        }

        #messages li.sent-msg {
            align-self: flex-end;
            flex-direction: row-reverse;
            animation: sentBubble 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: bottom right;
        }

        #messages li.received-msg {
            align-self: flex-start;
            animation: receivedBubble 0.35s ease-out forwards;
            transform-origin: bottom left;
        }

        #messages li.dissolving {
            animation: dissolveOut 0.5s ease-out forwards !important;
            overflow: hidden;
            pointer-events: none;
        }

        .msg-content-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .sent-msg .msg-content-wrapper { align-items: flex-end; }
        .received-msg .msg-content-wrapper { align-items: flex-start; }

        .msg-bubble {
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            max-width: 100%;
        }

        .sent-msg .msg-bubble { border-bottom-right-radius: 4px; }
        .received-msg .msg-bubble { border-bottom-left-radius: 4px; }

        .msg-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 4px;
            gap: 15px;
        }

        .replied-quote {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #007bff;
            padding: 6px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.82rem;
        }

        .msg-image {
            max-width: 280px;
            max-height: 260px;
            border-radius: 12px;
            margin-top: 6px;
            display: block;
            cursor: pointer;
            object-fit: cover;
        }

        /* --- BURBUJA DE AUDIO ESTILO APP DISCORD (IDÉNTICO A CAPTURA 2) --- */
        .discord-audio-pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #2b2d31;
            padding: 8px 16px 8px 10px;
            border-radius: 24px;
            color: #ffffff;
            margin-top: 4px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .discord-audio-play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #5865f2;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: transform 0.15s, background 0.2s;
        }
        .discord-audio-play-btn:hover {
            transform: scale(1.06);
            background: #4752c4;
        }

        .discord-audio-waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            letter-spacing: 1px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
        }

        .discord-audio-time {
            font-size: 0.85rem;
            color: #dbdee1;
            font-weight: 500;
            margin-left: 4px;
        }

        /* --- BARRA DE GRABACIÓN DE TEXTO COMPLETA (IDÉNTICO A CAPTURA 1) --- */
        .chat-form {
            display: flex;
            position: relative;
            align-items: center;
            background: #2b2d31;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 6px 12px;
            gap: 8px;
            min-height: 48px;
        }

        .recording-overlay-bar {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2b2d31;
            border-radius: 20px;
            padding: 6px 14px;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }
        .recording-overlay-bar.active { display: flex; animation: modalFadeIn 0.15s ease-out; }

        .rec-trash-btn {
            background: transparent;
            border: none;
            color: #b5bac1;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .rec-trash-btn:hover { color: #ff4757; }

        .rec-timer-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f2f3f5;
        }

        .rec-dot-red {
            width: 10px;
            height: 10px;
            background: #ed4245;
            border-radius: 50%;
            animation: pulseMicDot 1s infinite alternate;
        }

        @keyframes pulseMicDot {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.3; transform: scale(0.85); }
        }

        .rec-waveform-anim {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            flex: 1;
            justify-content: center;
            opacity: 0.9;
        }

        .rec-send-btn {
            background: #5865f2;
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.15s, background 0.2s;
        }
        .rec-send-btn:hover { background: #4752c4; transform: scale(1.05); }

        .chat-form input[type="text"] {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .attach-btn, .gif-btn, .emoji-toggle-btn, .mic-btn {
            background: transparent;
            border: none;
            color: #b5bac1;
            cursor: pointer;
            font-size: 1.25rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .attach-btn:hover, .gif-btn:hover, .emoji-toggle-btn:hover, .mic-btn:hover {
            color: #dbdee1;
            background: rgba(255,255,255,0.06);
        }

        .gif-btn {
            font-size: 0.75rem;
            font-weight: 800;
            border: 1.5px solid #b5bac1;
            border-radius: 6px;
            padding: 2px 5px;
            line-height: 1;
        }

        .gif-btn:hover {
            border-color: #dbdee1;
        }

        /* --- POPUP TENOR GIF --- */
        .gif-picker-popup {
            display: none;
            position: absolute;
            bottom: 110%;
            right: 0;
            width: 330px;
            height: 360px;
            background: #2b2d31;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            z-index: 500;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }
        .gif-picker-popup.show { display: flex; animation: modalFadeIn 0.15s ease-out; }

        .gif-search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: #1e1f22;
            color: #fff;
            outline: none;
            font-size: 0.88rem;
            margin-bottom: 10px;
        }

        .gif-results-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            overflow-y: auto;
        }

        .gif-item-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .gif-item-img:hover { transform: scale(1.03); filter: brightness(1.1); }

        /* --- REACCIONES Y MENÚS --- */
        .message-reactions-bar {
            display: none;
            position: absolute;
            top: -16px; right: 10px;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px; gap: 2px;
            align-items: center;
        }
        #messages li:hover .message-reactions-bar { display: flex; }

        .react-quick-btn {
            background: transparent; border: none;
            font-size: 1rem; cursor: pointer; padding: 4px 6px;
            border-radius: 6px;
        }
        .react-quick-btn:hover { background: rgba(255, 255, 255, 0.12); }

        .reactions-display-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

        .reaction-pill {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; cursor: pointer;
        }

        .image-viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        .image-viewer-overlay.active { opacity: 1; pointer-events: auto; }
        .image-viewer-content img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }

        .close-viewer-btn {
            position: absolute; top: -15px; right: -15px;
            background: #111; color: #fff; border: 2px solid var(--border-color);
            border-radius: 50%; width: 36px; height: 36px; cursor: pointer;
        }

        #reply-preview-container {
            display: none; background: var(--bg-input); border: 1px solid var(--border-color);
            padding: 8px 12px; border-radius: 8px; margin-bottom: 8px;
            justify-content: space-between; align-items: center;
        }

        .users-sidebar {
            width: 280px; background: var(--bg-sidebar); border-left: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; transition: all 0.3s;
        }
        .users-sidebar.collapsed { width: 0 !important; padding: 0 !important; overflow: hidden !important; }

        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.85rem; color: #000; object-fit: cover;
        }

        #users-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        #users-list li { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 8px 12px; border-radius: 8px; }
        .user-left { display: flex; align-items: center; gap: 10px; }

        .emoji-picker-popup {
            display: none; position: absolute; bottom: 110%; right: 0; width: 310px; height: 250px;
            background: #1a1a24; border: 1px solid var(--border-color); border-radius: 12px;
            z-index: 500; flex-direction: column; overflow: hidden;
        }
        .emoji-picker-popup.show { display: flex; }
        .emoji-grid-container { flex: 1; padding: 10px; overflow-y: auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .emoji-item { font-size: 1.25rem; cursor: pointer; text-align: center; padding: 4px; }

        .mentions-autocomplete {
            display: none; position: absolute; bottom: 110%; left: 0; width: 320px;
            background: #2b2d31; border-radius: 8px; z-index: 500; max-height: 230px; overflow-y: auto; padding: 6px 0;
        }
        .mentions-autocomplete.show { display: block; }
        .mention-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; }
        .mention-item:hover { background: rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body>

    <div class="top-right-controls">
        <button class="control-btn" id="admin-trigger">Admin Access</button>
        <button class="control-btn logout-btn-top" id="logout-btn" style="display: none;">Cerrar Sesión</button>
    </div>

    <!-- Modal Admin -->
    <div id="admin-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Panel Admin</h2>
            <input type="password" id="admin-pass-input" placeholder="Contraseña..." autocomplete="off">
            <button class="main-btn" id="admin-login-btn">Acceder</button>
            <button class="main-btn" id="admin-close-btn" style="background: #333; margin-top: 8px;">Cancelar</button>
        </div>
    </div>

    <!-- Modal SETTINGS -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box settings-modal-box">
            <h2>⚙️ Configuración</h2>
            <div class="settings-grid">
                <div class="setting-card">
                    <label>Tema de Interfaz</label>
                    <div class="setting-options">
                        <button class="opt-btn theme-opt active" data-val="default">Oscuro</button>
                        <button class="opt-btn theme-opt" data-val="cyberpunk">Cyber</button>
                        <button class="opt-btn theme-opt" data-val="midnight">Midnight</button>
                        <button class="opt-btn theme-opt" data-val="light">Claro</button>
                    </div>
                </div>
            </div>
            <button class="main-btn" id="close-settings-btn">Guardar y Cerrar</button>
        </div>
    </div>

    <!-- Modal Bienvenida -->
    <div id="welcome-modal-overlay" class="modal-overlay">
        <div class="welcome-box">
            <h2 class="welcome-title">¡Bienvenido al Chat!</h2>
            <p class="welcome-sub">Personaliza tu perfil para comenzar a conversar</p>
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" />
            <div class="avatar-picker-wrapper">
                <div class="avatar-preview-img" id="avatar-preview-box">👤</div>
                <button type="button" class="pencil-btn" id="pencil-avatar-btn">✏️</button>
            </div>
            <input type="text" id="nickname-input" placeholder="Escribe tu apodo aquí..." autocomplete="off" maxlength="20">
            <button class="main-btn" id="join-btn">Entrar al Chat</button>
        </div>
    </div>

    <!-- Visor de Imágenes -->
    <div class="image-viewer-overlay" id="image-viewer">
        <div class="image-viewer-content">
            <button class="close-viewer-btn" id="close-viewer-btn">✕</button>
            <img id="viewer-full-img" src="" alt="Imagen">
        </div>
    </div>

    <!-- Chat Principal -->
    <div class="chat-container">
        <div class="chat-main">
            <div class="chat-header">
                <div class="header-title">
                    <span>Chat online</span>
                    <div class="status-dropdown-container">
                        <div class="online-badge" id="current-status-badge">
                            <span class="status-icon online" id="current-status-icon"></span>
                            <span id="txt-active">Activo</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-icon-btn" id="toggle-sidebar-btn">👥</button>
                    <button class="action-icon-btn" id="open-settings-btn">⚙️</button>
                </div>
            </div>
            
            <ul id="messages"></ul>

            <div id="reply-preview-container">
                <div class="reply-preview-content">
                    <span id="reply-preview-user"></span>
                    <span id="reply-preview-text"></span>
                </div>
                <button id="cancel-reply-btn">&times;</button>
            </div>

            <!-- FORMULARIO DE MENSAJES -->
            <form id="form" class="chat-form">
                <div class="mentions-autocomplete" id="mentions-popup"></div>

                <!-- OVERLAY DE GRABACIÓN DE AUDIO DE BARRA COMPLETA -->
                <div class="recording-overlay-bar" id="rec-overlay-bar">
                    <button type="button" class="rec-trash-btn" id="rec-cancel-btn" title="Descartar">🗑️</button>
                    <div class="rec-timer-group">
                        <span class="rec-dot-red"></span>
                        <span id="rec-timer-text">0:00</span>
                    </div>
                    <div class="rec-waveform-anim">
                        ··|·i·:·|··i·|·
                    </div>
                    <button type="button" class="rec-send-btn" id="rec-confirm-btn" title="Enviar audio">➤</button>
                </div>

                <input type="file" id="image-file-input" accept="image/*" style="display: none;" />
                <button type="button" class="attach-btn" id="attach-btn" title="Adjuntar imagen">+</button>

                <input type="text" id="input" autocomplete="off" placeholder="Escribe un mensaje..." />

                <button type="button" class="gif-btn" id="gif-toggle-btn" title="Buscar GIF">GIF</button>
                <button type="button" class="emoji-toggle-btn" id="emoji-toggle-btn">😊</button>
                
                <!-- BOTÓN MICRÓFONO -->
                <button type="button" class="mic-btn" id="mic-btn" title="Grabar nota de voz">🎙️</button>

                <button class="main-btn" id="btn-send" style="display:none;"></button>

                <!-- POPUP TENOR GIF -->
                <div class="gif-picker-popup" id="gif-picker-popup">
                    <input type="text" class="gif-search-input" id="gif-search-input" placeholder="Buscar en Tenor GIFs...">
                    <div class="gif-results-grid" id="gif-results-grid"></div>
                </div>

                <!-- POPUP EMOJIS -->
                <div class="emoji-picker-popup" id="emoji-picker-popup">
                    <div class="emoji-grid-container" id="emoji-grid"></div>
                </div>
            </form>
        </div>

        <div class="users-sidebar" id="sidebar">
            <h3>Conectados (<span id="user-count">0</span>)</h3>
            <ul id="users-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const welcomeModalOverlay = document.getElementById('welcome-modal-overlay');
        const nicknameInput = document.getElementById('nickname-input');
        const joinBtn = document.getElementById('join-btn');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const pencilAvatarBtn = document.getElementById('pencil-avatar-btn');
        const avatarPreviewBox = document.getElementById('avatar-preview-box');
        const logoutBtn = document.getElementById('logout-btn');

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');
        const userCount = document.getElementById('user-count');

        const micBtn = document.getElementById('mic-btn');
        const recOverlayBar = document.getElementById('rec-overlay-bar');
        const recCancelBtn = document.getElementById('rec-cancel-btn');
        const recConfirmBtn = document.getElementById('rec-confirm-btn');
        const recTimerText = document.getElementById('rec-timer-text');

        const gifToggleBtn = document.getElementById('gif-toggle-btn');
        const gifPickerPopup = document.getElementById('gif-picker-popup');
        const gifSearchInput = document.getElementById('gif-search-input');
        const gifResultsGrid = document.getElementById('gif-results-grid');

        const emojiToggleBtn = document.getElementById('emoji-toggle-btn');
        const emojiPickerPopup = document.getElementById('emoji-picker-popup');
        const emojiGrid = document.getElementById('emoji-grid');

        let myNickname = '';
        let myAvatarBase64 = null;
        let currentUsersData = {};
        let replyingTo = null;

        // ESTADO GRABACIÓN AUDIO
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recStartTime = 0;
        let recInterval = null;

        // TENOR GIF API (LVIACR3EACN5 key pública genérica)
        const TENOR_API_KEY = "LVIACR3EACN5";

        // VIBRACIÓN Y AUDIO SATISFACCIÓN
        function triggerHapticFeedback(freq = 600) {
            if (navigator.vibrate) navigator.vibrate(35);
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain); osc.start(); osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        // CONTROL DE GRABACIÓN DE AUDIO ESTILO DISCORD
        micBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.start();
                isRecording = true;
                recStartTime = Date.now();
                recOverlayBar.classList.add('active');
                triggerHapticFeedback(750);

                recInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
                    const m = Math.floor(elapsed / 60);
                    const s = elapsed % 60;
                    recTimerText.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                }, 1000);

            } catch (err) {
                alert('No se pudo acceder al micrófono.');
            }
        });

        recCancelBtn.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
            stopRecUI();
            triggerHapticFeedback(300);
        });

        recConfirmBtn.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => sendAudioMessage(reader.result);
                    reader.readAsDataURL(audioBlob);
                    mediaRecorder.stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.stop();
            }
            stopRecUI();
            triggerHapticFeedback(900);
        });

        function stopRecUI() {
            isRecording = false;
            clearInterval(recInterval);
            recTimerText.textContent = "0:00";
            recOverlayBar.classList.remove('active');
        }

        function sendAudioMessage(base64Audio) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            socket.emit('chat message', {
                text: '',
                image: null,
                audio: base64Audio,
                time: timeStr,
                replyTo: replyingTo
            });
            replyingTo = null;
        }

        // BUSCADOR TENOR GIFS
        gifToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            gifPickerPopup.classList.toggle('show');
            if (gifPickerPopup.classList.contains('show')) fetchGifs('');
        });

        gifSearchInput.addEventListener('input', () => fetchGifs(gifSearchInput.value.trim()));

        async function fetchGifs(query) {
            const endpoint = query ? 
                `https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=${TENOR_API_KEY}&limit=12` : 
                `https://g.tenor.com/v1/trending?key=${TENOR_API_KEY}&limit=12`;

            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                renderGifs(data.results || []);
            } catch (err) {}
        }

        function renderGifs(results) {
            gifResultsGrid.innerHTML = '';
            results.forEach(gif => {
                const imgUrl = gif.media[0].gif.url;
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = 'gif-item-img';
                img.addEventListener('click', () => {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    socket.emit('chat message', {
                        text: '',
                        image: imgUrl,
                        audio: null,
                        time: timeStr,
                        replyTo: replyingTo
                    });
                    gifPickerPopup.classList.remove('show');
                    replyingTo = null;
                });
                gifResultsGrid.appendChild(img);
            });
        }

        // PANTALLA BIENVENIDA PERSISTENTE
        pencilAvatarBtn.addEventListener('click', () => avatarFileInput.click());
        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    myAvatarBase64 = evt.target.result;
                    avatarPreviewBox.innerHTML = `<img src="${myAvatarBase64}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        });

        function checkAutoLogin() {
            const savedNickname = localStorage.getItem('chat_nickname');
            const savedAvatar = localStorage.getItem('chat_avatar');
            if (savedNickname) {
                myNickname = savedNickname;
                myAvatarBase64 = savedAvatar || null;
                socket.emit('join', { nickname: myNickname, avatar: myAvatarBase64 });
                welcomeModalOverlay.style.display = 'none';
            }
        }

        joinBtn.addEventListener('click', () => {
            const name = nicknameInput.value.trim();
            if (name) {
                myNickname = name;
                localStorage.setItem('chat_nickname', myNickname);
                if (myAvatarBase64) localStorage.setItem('chat_avatar', myAvatarBase64);
                socket.emit('join', { nickname: myNickname, avatar: myAvatarBase64 });
                welcomeModalOverlay.style.display = 'none';
            }
        });

        // ENVIAR TEXTO
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                socket.emit('chat message', {
                    text: input.value,
                    image: null,
                    audio: null,
                    time: timeStr,
                    replyTo: replyingTo
                });
                input.value = '';
                replyingTo = null;
            }
        });

        // MENSAGEIRO RECIBIDO Y REPRODUCTOR AUDIO TIPO APP
        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.id = data.id;
            const isMe = (data.senderId === socket.id);
            item.className = isMe ? 'sent-msg' : 'received-msg';

            const initial = data.user ? data.user.charAt(0).toUpperCase() : '?';
            const userAvatarHtml = data.avatar ? 
                `<img src="${data.avatar}" class="user-avatar">` : 
                `<div class="user-avatar" style="background-color: ${data.color}">${initial}</div>`;

            let audioHtml = '';
            if (data.audio) {
                audioHtml = `
                    <div class="discord-audio-pill">
                        <button class="discord-audio-play-btn" type="button">▶</button>
                        <div class="discord-audio-waveform">
                            ··|·i·:·|··i·|·
                        </div>
                        <span class="discord-audio-time">0:00</span>
                    </div>
                `;
            }

            let imageHtml = data.image ? `<img src="${data.image}" class="msg-image" />` : '';

            item.innerHTML = `
                ${userAvatarHtml}
                <div class="msg-content-wrapper">
                    <div class="msg-bubble" style="background-color: ${data.color}">
                        <div class="msg-info"><span><strong>${data.user}</strong></span><span>${data.time}</span></div>
                        ${data.text ? `<div>${data.text}</div>` : ''}
                        ${imageHtml}
                        ${audioHtml}
                    </div>
                </div>
            `;

            // INICIALIZADOR DE AUDIO
            if (data.audio) {
                const audioObj = new Audio(data.audio);
                const playBtn = item.querySelector('.discord-audio-play-btn');
                const timeLabel = item.querySelector('.discord-audio-time');

                audioObj.addEventListener('loadedmetadata', () => {
                    const m = Math.floor(audioObj.duration / 60);
                    const s = Math.floor(audioObj.duration % 60);
                    timeLabel.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                });

                audioObj.addEventListener('ended', () => {
                    playBtn.textContent = '▶';
                });

                playBtn.addEventListener('click', () => {
                    if (audioObj.paused) {
                        audioObj.play();
                        playBtn.textContent = '❚❚';
                    } else {
                        audioObj.pause();
                        playBtn.textContent = '▶';
                    }
                });
            }

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('update-users', (usersObj) => {
            currentUsersData = usersObj;
            usersList.innerHTML = '';
            userCount.textContent = Object.keys(usersObj).length;
            Object.values(usersObj).forEach(u => {
                const li = document.createElement('li');
                li.innerHTML = `<span style="color:${u.color}; font-weight:bold;">${u.nickname}</span>`;
                usersList.appendChild(li);
            });
        });

        checkAutoLogin();
    </script>
</body>
</html>
